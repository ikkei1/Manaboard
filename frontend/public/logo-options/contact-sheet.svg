<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-label="Manaboard logo options">
  <rect width="1120" height="820" fill="#f1f5f9"/>
  <text x="56" y="68" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Manaboard logo options</text>
  <text x="58" y="100" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">A-Dから選んでください</text>
  <g transform="translate(56 140)">
    <text x="0" y="-16" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">A</text>
    <image href="./logo-a-board.svg" x="0" y="0" width="480" height="148"/>
  </g>
  <g transform="translate(584 140)">
    <text x="0" y="-16" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">B</text>
    <image href="./logo-b-path.svg" x="0" y="0" width="480" height="148"/>
  </g>
  <g transform="translate(56 390)">
    <text x="0" y="-16" fill="#1e293b" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">C</text>
    <image href="./logo-c-grid.svg" x="0" y="0" width="480" height="148"/>
  </g>
  <g transform="translate(584 390)">
    <text x="0" y="-16" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">D</text>
    <image href="./logo-d-timer.svg" x="0" y="0" width="480" height="148"/>
  </g>
  <g transform="translate(56 650)">
    <rect width="1008" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="28" y="38" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">A</text>
    <text x="60" y="38" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">一番アプリらしい。学習ボード感が強い。</text>
    <text x="28" y="68" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">B</text>
    <text x="60" y="68" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">やわらかい。教材・復習感が強い。</text>
    <text x="520" y="38" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">C</text>
    <text x="552" y="38" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">整理された印象。管理ツール感が強い。</text>
    <text x="520" y="68" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">D</text>
    <text x="552" y="68" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">ポモドーロと相性がいい。集中感が強い。</text>
  </g>
</svg>
